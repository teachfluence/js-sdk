query SdkLiveEvent($organizationSlug: String!, $slug: String!) {
  liveEvent(organizationSlug: $organizationSlug, slug: $slug) {
    id
    title
    slug
    shortDescription
    viewerCanOrder
    viewerBlockedByPurchaseGate
    viewerCanOrderAsGift
    salesPaused
    remainingCapacity
    sellingPrice {
      amount
      currency
    }
    discountedPrice {
      amount
      currency
    }
  }
}
