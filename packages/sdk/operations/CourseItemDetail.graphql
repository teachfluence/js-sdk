query SdkCourseItemDetail($itemId: ID!) {
  node(id: $itemId) {
    __typename
    ... on CourseItem {
      id
      title
      slug
      typeLabel
      freeAccess
      hidden
      viewerHasAccess
      releaseDate
      dripType
      dripDaysDelay
      attachments {
        id
        title
        fileName
        fileType
        fileSize
      }
      viewerProgress {
        id
        progress
        status
        updatedAt
      }
    }
    ... on VideoCourseItem {
      video {
        id
        duration
        status
        url
        posterUrl
        chaptersVttUrl
        captions {
          language
          label
          status
          url
        }
      }
    }
    ... on AudioCourseItem {
      audio {
        id
        url
        duration
        status
      }
    }
    ... on ArticleCourseItem {
      content
      contentRich {
        html
        text
      }
    }
    ... on DocumentCourseItem {
      description
      descriptionRich {
        html
        text
      }
    }
    ... on QuestionCourseItem {
      description
      descriptionRich {
        html
        text
      }
      question
      questionRich {
        html
        text
      }
      hints
      hintsRich {
        html
        text
      }
    }
    ... on QuizCourseItem {
      description
      descriptionRich {
        html
        text
      }
      allowSkip
      allowRetake
      quiz {
        __typename
        id
        title
        question
        questionRich {
          html
          text
        }
        ... on MultipleChoiceQuiz {
          options {
            content
            contentRich {
              html
              text
            }
            description
            descriptionRich {
              html
              text
            }
            isCorrect
          }
        }
        ... on FreeResponseQuiz {
          sampleAnswer
          sampleAnswerRich {
            html
            text
          }
        }
        ... on PhraseSelectionQuiz {
          paragraph
          paragraphRich {
            html
            text
          }
          minSelections
          maxSelections
          selectablePhrases {
            phraseId
            content
            contentRich {
              html
              text
            }
          }
        }
        ... on CategorizationQuiz {
          items {
            id
            content
            contentRich {
              html
              text
            }
          }
          groups {
            id
            content
            contentRich {
              html
              text
            }
          }
        }
        ... on FillInBlankQuiz {
          content
          contentRich {
            html
            text
          }
          blanks {
            blankId
          }
        }
        ... on OrderingQuiz {
          shuffleOnDisplay
          items {
            id
            content
            contentRich {
              html
              text
            }
          }
        }
        ... on MatchingQuiz {
          leftItems {
            id
            content
            contentRich {
              html
              text
            }
          }
          rightItems {
            id
            content
            contentRich {
              html
              text
            }
          }
        }
      }
      viewerLatestSubmission {
        id
        status
        grade
        gradeFeedback
        gradeFeedbackRich {
          html
          text
        }
        selectedChoiceIndex
        freeResponseAnswer
        freeResponseAnswerRich {
          html
          text
        }
        structuredAnswer
        gradingDetails
        submittedAt
        selectedOption {
          content
          contentRich {
            html
            text
          }
          description
          descriptionRich {
            html
            text
          }
          isCorrect
        }
      }
      viewerBestSubmission {
        id
        status
        grade
        submittedAt
      }
    }
    ... on AssignmentCourseItem {
      description
      descriptionRich {
        html
        text
      }
      allowRichText
      allowFileUpload
      allowMultipleSubmissions
      dueDate
      lateSubmissionDeadline
      viewerLatestAssignmentSubmission: viewerLatestSubmission {
        id
        status
        freeResponseAnswer
        freeResponseAnswerRich {
          html
          text
        }
        grade
        gradeFeedback
        gradeFeedbackRich {
          html
          text
        }
        createdAt
        submittedAt
        gradedAt
        attachments {
          id
          title
          fileName
          fileType
          fileSize
        }
      }
    }
    ... on ExamCourseItem {
      instructions
      instructionsRich {
        html
        text
      }
      quizCount
      timeLimitSeconds
      passingGradePercentage
      maxAttempts
      allowPause
      allowBack
      allowSkip
      viewerCanStartSession
      viewerCurrentSession {
        id
      }
      viewerLatestFinishedSession {
        id
      }
    }
    ... on EmbedCourseItem {
      description
      descriptionRich {
        html
        text
      }
      url
    }
    ... on LiveCourseItem {
      description
      descriptionRich {
        html
        text
      }
      url
      platform
      startDate
      endDate
    }
    ... on FormCourseItem {
      allowRetake
      form {
        id
        title
        slug
      }
    }
    ... on ForumCourseItem {
      forum {
        id
      }
    }
    ... on ScormCourseItem {
      masteryScore
      maxTimeAllowed
    }
    ... on Cmi5CourseItem {
      auIri
    }
  }
}
