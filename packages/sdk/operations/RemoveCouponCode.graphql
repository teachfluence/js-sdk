mutation SdkRemoveCouponCode($input: RemoveCouponCodeInput!) {
  removeCouponCode(input: $input) {
    cart {
      id
      discountedPrice {
        presentmentMoney {
          amount
          currency
        }
      }
      promotions {
        id
      }
    }
    userErrors {
      code
      field
      message
    }
  }
}
