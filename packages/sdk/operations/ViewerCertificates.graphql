query SdkViewerCertificates(
  $first: Int! = 20
  $after: String
  $status: StudentCertificateStatus
) {
  studentCertificates(first: $first, after: $after, status: $status) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      cursor
      node {
        id
        certificateNumber
        issuedAt
        revokedAt
        status
        publicUrl
        linkedInAddUrl
        courseAcademicTerm {
          id
          title
          slug
        }
      }
    }
  }
}
