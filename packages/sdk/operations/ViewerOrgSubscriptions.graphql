query SdkViewerOrgSubscriptions($organizationSlug: String!) {
  organization(slug: $organizationSlug) {
    id
    viewerStudentOrgSubscriptions {
      id
      status
      grantsAccess
      currentPeriodEnd
      cancelAtPeriodEnd
      isLifetime
      canConvertToPaid
      renewalCardNotice {
        endsAt
        showFrom
        dismissible
      }
      tier {
        id
        name
        slug
      }
    }
  }
}
