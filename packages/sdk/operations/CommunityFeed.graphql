query SdkCommunityFeed($organizationId: ID!, $after: String, $spaceIds: [ID!], $sort: CommunityPostSortOrder, $authorRole: CommunitySpaceMemberRole) {
  communityFeed(organizationId: $organizationId, first: 25, after: $after, spaceIds: $spaceIds, sort: $sort, authorRole: $authorRole) {
    totalCount
    pageInfo {
      hasNextPage
      endCursor
    }
    edges {
      node {
        ...SdkCommunityPostCard
      }
    }
    userErrors {
      code
      field
      message
    }
  }
}

fragment SdkCommunityPostCard on CommunityPost {
  id
  title
  content
  contentRich {
    html
    text
  }
  type
  status
  createdAt
  lastActivityAt
  editedAt
  isPinned
  isLocked
  pinnedAt
  commentCount
  viewerIsAuthor
  viewerCanComment
  viewerCanEdit
  viewerCanDelete
  viewerCanReport
  viewerHasReported
  viewerContentWithheld
  space {
    id
    name
    slug
  }
  author {
    id
    displayName
    image
    isStaff
    viewerIsSelf
  }
  reactions {
    kind
    count
    viewerReacted
  }
  reactors(first: 1) {
    edges {
      kind
      reactedAt
      node {
        id
        displayName
        image
        isStaff
        viewerIsSelf
      }
    }
  }
  attachments {
    id
    fileName
    contentType
    sizeBytes
    scanStatus
    url
  }
}
