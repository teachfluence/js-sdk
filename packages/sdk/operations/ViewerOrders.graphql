query SdkViewerOrders($first: Int! = 20, $after: String) {
  viewer {
    __typename
    ... on OrganizationStudent {
      id
      orders(first: $first, after: $after) {
        totalCount
        pageInfo {
          hasNextPage
          endCursor
        }
        edges {
          cursor
          node {
            id
            slug
            status
            createdAt
            discountedPrice {
              presentmentMoney {
                amount
                currency
              }
            }
          }
        }
      }
    }
  }
}
