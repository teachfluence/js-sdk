mutation SdkUpdateAssignmentSubmission($input: UpdateAssignmentSubmissionInput!) {
  updateAssignmentSubmission(input: $input) {
    assignmentSubmission {
      id
      status
      freeResponseAnswer
      grade
      gradeFeedback
      createdAt
      submittedAt
      gradedAt
      attachments {
        id
        title
        fileName
        fileType
        fileSize
      }
    }
    userErrors {
      code
      field
      message
    }
  }
}
