query SdkOrgSubscriptionProducts(
  $organizationSlug: String!
  $first: Int! = 20
  $after: String
) {
  organization(slug: $organizationSlug) {
    id
    orgSubscriptionProducts(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          name
          slug
          description
          allowMonthly
          allowYearly
          allowLifetime
          tiers {
            id
            name
            slug
            description
            features
            objectIndex
            trialPeriodDays
            viewerCanOrder
            salesPaused
            pricing {
              id
              currency
              interval
              intervalCount
              originalPrice
              sellingPrice
              enabled
            }
            lifetimePricing {
              id
              currency
              originalPrice
              sellingPrice
              enabled
            }
          }
        }
      }
    }
  }
}
