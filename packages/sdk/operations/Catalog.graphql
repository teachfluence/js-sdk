query SdkCatalog($organizationSlug: String!, $first: Int! = 20, $after: String) {
  organization(slug: $organizationSlug) {
    id
    name
    slug
    courses(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          title
          slug
          shortDescription
        }
      }
    }
    bundles(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          title
          slug
          shortDescription
          viewerCanOrder
          salesPaused
          sellingPrice {
            amount
            currency
          }
          discountedPrice {
            amount
            currency
          }
        }
      }
    }
    digitalProducts(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          title
          slug
          shortDescription
          viewerCanOrder
          salesPaused
          sellingPrice {
            amount
            currency
          }
          discountedPrice {
            amount
            currency
          }
        }
      }
    }
    liveEvents(first: $first, after: $after) {
      totalCount
      pageInfo {
        hasNextPage
        endCursor
      }
      edges {
        cursor
        node {
          id
          title
          slug
          shortDescription
          viewerCanOrder
          salesPaused
          sellingPrice {
            amount
            currency
          }
          discountedPrice {
            amount
            currency
          }
        }
      }
    }
  }
}
