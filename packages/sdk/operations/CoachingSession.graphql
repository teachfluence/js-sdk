query SdkCoachingSession($organizationSlug: String!, $slug: String!) {
  coachingSession(organizationSlug: $organizationSlug, slug: $slug) {
    id
    title
    slug
    plans {
      id
      name
      slug
      sessionCount
      sessionDurationMinutes
      viewerCanOrder
      salesPaused
      sellingPrice {
        amount
        currency
      }
      discountedPrice {
        amount
        currency
      }
    }
  }
}
